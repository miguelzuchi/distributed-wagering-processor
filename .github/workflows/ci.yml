name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Static checks and unit tests
        run: |
          bun run build
          bun run lint
          bun run test:cov

      - name: Start integration infrastructure
        run: bun run infra:up

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Show infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop integration infrastructure
        if: always()
        run: bun run infra:down

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag distributed-wagering-processor:test .
